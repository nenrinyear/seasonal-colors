name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: npm test
